# yaml-language-server: $schema=../study.schema.json
# FitzHugh-Nagumo twin experiment with 20 noise realizations, for the statistics of the
# estimates over the noise. Run from this directory:
#   kipe synthesis study_realizations.yaml  # data/r00/ to data/r19/, with the nominal parameters
#   kipe estimation study_realizations.yaml  # estimates a, b, c from each realization
#   kipe sensitivity study_realizations.yaml  # the bounds, to compare the spread with
#   python analysis.py study_realizations.yaml  # the figures (analysis.py)
output:
  path: results_realizations
  log_level: info

forward_solver:
  factory: kipe.examples.fitzhugh_nagumo:Solver
  arguments: {dt: 0.05}  # nominal parameter values in solver: a = 0.2, b = 0.2, c = 3

parameters:
  reparameterization: log
  priors:
    a: {mean: 0.3, relative_stddev: 0.1}
    b: {mean: 0.3, relative_stddev: 0.1}
    c: {mean: 2.0, relative_stddev: 0.1}

measurements:
  v:
    fields: [v]
    times: {start: 0.5, stop: 20.0, step: 0.5}
    data: {type: numpy, path: 'data/r{realization:02d}/v.npz'}
    noise: {stddev: 0.05, seed: 0}
  w:
    fields: [w]
    times: {start: 0.5, stop: 20.0, step: 0.5}
    data: {type: numpy, path: 'data/r{realization:02d}/w.npz'}
    noise: {stddev: 0.05, seed: 1}

synthesis:
  realizations: 20

estimation:
  iterations: 3
