# Heat equation twin experiment with FEniCSx (needs dolfinx). Run from this directory:
#   python measurement_mesh.py     # writes data/measurement_mesh.xdmf, a coarser mesh
#   kipe synthesis study.yaml      # generates data/u.npz on it, with the nominal parameters
#   kipe estimation study.yaml     # estimates kappa and a from it, starting from a wrong guess
# Both kipe commands also run in parallel, e.g., mpirun -n 2 kipe estimation study.yaml

output:
  path: results
  log_level: info

forward_solver:
  factory: "kipe.fenicsx.examples.heat:Solver"
  arguments: {n: 16, dt: 0.01}      # nominal (true) parameters: kappa = 0.1, a = 1

parameters:
  reparameterization: log
  select:
    kappa: {initial: 0.12, relative_stddev: 0.1}
    a: {initial: 0.8, relative_stddev: 0.1}

measurements:
  u:
    fields: [u]
    times: {start: 0.05, stop: 0.5, step: 0.05}
    data: {type: numpy, path: data/u.npz}
    noise: {stddev: 0.001, seed: 0}
    # interpolated onto the measurement mesh; the data are in the order of its vertices
    spatial_sampling: {type: fenicsx.mesh, mesh: data/measurement_mesh.xdmf, element: P1}

synthesis:
  truth: {type: run}                # run the solver with its nominal parameters (the default)

estimation:
  sigma_points: simplex
  iterations: 3                     # outer iterations: restart from the previous estimate
