# Heat equation: slower outer convergence with a narrower initial prior.
# Run from examples/heat. Uses the same data/u.npz in both cases.
output:
  path: results/slow_prior_0005/plain
  log_level: info

forward_solver:
  factory: kipe.fenicsx.examples.heat:Solver
  arguments: {n: 16, dt: 0.01}  # nominal (true) parameters: kappa = 0.1, a = 1

parameters:
  reparameterization: log
  priors:
    kappa: {mean: 0.12, relative_stddev: 0.005}
    a: {mean: 0.8, relative_stddev: 0.005}

measurements:
  u:
    fields: [u]
    times: {start: 0.05, stop: 0.5, step: 0.05}
    data: {type: numpy, path: data/u.npz}
    noise: {stddev: 0.001, seed: 0}
    # interpolated onto the measurement mesh; the data are in the order of its vertices
    spatial_sampling:
      type: fenicsx.mesh
      mesh: data/measurement_mesh.xdmf
      element: P1

synthesis:
  truth: {type: run}  # run the solver with its nominal parameters (the default)

estimation:
  sigma_points: simplex
  iterations: 15  # complete ROUKF passes
