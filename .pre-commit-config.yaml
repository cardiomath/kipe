# Install: pip install ".[check]" && pre-commit install --hook-type pre-commit --hook-type commit-msg
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9  # keep in sync with the ruff pin in pyproject.toml [check]
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1  # keep in sync with the mypy pin in pyproject.toml [check]
    hooks:
      - id: mypy
        files: ^(src|tests)/
        pass_filenames: false
        additional_dependencies: [matplotlib, mpi4py, numpy, pytest, pydantic, ruamel.yaml]

  # The scope is optional: the module a commit is about, or the area for non-code changes,
  # e.g., "feat(plot): ...", "fix(estimation,roukf): ..."; no scope for broader commits.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --scopes=cli,options,forward-solver,parameters,measurements,sampling,synthesis,estimation,roukf,plot,provenance,fenicsx,examples,docs,ci,pre-commit
