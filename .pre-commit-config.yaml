# Install: pip install ".[dev]"
#          pre-commit install --hook-type pre-commit --hook-type commit-msg
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9  # keep in sync with the ruff pin in pyproject.toml [dev]
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1  # keep in sync with the mypy pin in pyproject.toml [dev]
    hooks:
      - id: mypy
        files: ^(src|tests)/
        pass_filenames: false
        additional_dependencies: [matplotlib, mpi4py, numpy, pytest, pydantic, ruamel.yaml]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]  # warnings fail too, e.g., one space before a comment

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2

  - repo: local
    hooks:
      - id: study-schema
        name: generate study schema
        entry: bash -c 'kipe schema > examples/study.schema.json'
        language: system
        pass_filenames: false
        always_run: true

      # Needs the docs extra in the active environment: pip install -e ".[docs]"
      # Manual stage, skipped on commit; run it with
      #   pre-commit run sphinx-build --all-files --hook-stage manual
      # (without --hook-stage manual: "No hook with id `sphinx-build` in stage `pre-commit`")

      - id: sphinx-build
        name: sphinx docs build
        stages: [manual]
        entry: >-
          bash -c 'rm -fr docs/build docs/source/{_apidoc,_generated};
          python -m sphinx -q -W --keep-going -c docs -b html docs/source
          docs/build/html
          && python -m webbrowser -t "file://$(pwd)/docs/build/html/index.html"'
        language: system
        files: ^(docs/|src/.*\.py$|pyproject\.toml$)
        pass_filenames: false

  # The scope is optional: the module a commit is about, or the area for non-code changes,
  # e.g., "feat(plot): ...", "fix(estimation,roukf): ..."; no scope for broader commits.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --scopes=cli,options,forward-solver,parameters,measurements,sampling,synthesis,estimation,roukf,plot,provenance,fenicsx,examples,docs,ci,pre-commit
