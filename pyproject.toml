[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "kipe"
dynamic = ["version"] # from the git tags, see [tool.hatch.version]
description = """Parameter estimation with reduced-order unscented Kalman filtering, and \
identifiability analysis, for PDE models"""
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "David Nolte", email = "dajuno@users.noreply.github.com" }]
keywords = [
  "ROUKF",
  "unscented-kalman-filter",
  "data-assimilation",
  "parameter-estimation",
  "identifiability",
  "FEniCS",
  "inverse-problems",
  "fisher-information",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "mpi4py>=4",         # needs an MPI library at runtime, e.g., the system's or `pip install mpich`
  "numpy>=1.26",
  "pydantic>=2.7",     # use_attribute_docstrings
  "ruamel.yaml>=0.18", # YAML 1.2: 1e-3 is a float
  "matplotlib>=3.8",   # kipe plot
  "plotext>=6.1,<7",   # kipe plot --terminal, --watch
]

[project.scripts]
kipe = "kipe.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "jsonschema>=4", # the example study files against `kipe schema`, in tests only
  "scipy>=1.12",   # reference solutions in tests only
  "ruff==0.16.9",  # pinned: preview formatting differs between versions
  "mypy==2.3.1",
  "pre-commit",
]
docs = [
  "sphinx>=9,<10",               # conf.py's _show_annotated_as_its_type wraps Sphinx 9's internals
  "sphinx-rtd-theme>=3.1,<4",    # the first with Sphinx 9
  "myst-parser>=5,<6",           # the first with Sphinx 9
  "sphinxcontrib-mermaid>=1,<3",
  "sphinx-argparse-cli>=1.24,<2",  # the command line reference, from kipe's parser
]

[project.urls]
Homepage = "https://github.com/cardiomath/kipe"
Issues = "https://github.com/cardiomath/kipe/issues"

[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" } # without git, e.g., from an archive

[tool.ruff]
line-length = 97
preview = true
extend-exclude = [
  "*.md",
] # design docs contain deliberately aligned illustrative snippets

[tool.ruff.lint]
# see https://docs.astral.sh/ruff/rules/
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "FA",  # flake8-future-annotations
  "B",   # flake8-bugbear
  "I",   # isort
  "UP",  # pyupgrade
  "ICN", # flake8-import-conventions
  "NPY", # numpy-specific rules
  "FLY", # use f-string not static joins
  "G",   # logging format (lazy %-formatting, no f-strings in logging calls)
  "D",   # pydocstyle
  "DOC", # pydoclint
  "RUF", # Ruff-specific rules
]
ignore = [
  "undocumented-magic-method",        # D105
  "undocumented-public-init",         # D107: constructor args documented in class docstring
  "blank-line-after-function",        # D202
  "missing-blank-line-after-summary", # D205
  "docstring-missing-exception",      # DOC501
  "docstring-extraneous-exception",   # DOC502
]
allowed-confusables = ["σ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "DOC"] # test docstrings are optional

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
section-order = [
  "future",
  "standard-library",
  "mpi",
  "petsc",
  "third-party",
  "first-party",
  "local-folder",
]

[tool.ruff.lint.isort.sections]
"mpi" = ["mpi4py"]
"petsc" = ["petsc4py"]

[tool.mypy]
# src, plus the typed protocol-conformance tests (structural check of example solvers)
files = ["src", "tests/examples/test_fitzhugh_nagumo_protocol.py"]
mypy_path = "src"
# adapted from roukf, based on the suggested "strict" config:
# https://mypy.readthedocs.io/en/stable/existing_code.html#introduce-stricter-options
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
disallow_subclassing_any = true
disallow_any_generics = true
disallow_untyped_decorators = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_reexport = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "plotext"            # no type information
ignore_missing_imports = true

[[tool.mypy.overrides]]
# unknown (Any) everywhere, installed or not, so that mypy gives the same result with and
# without them (they are missing in the core checks; petsc4py's stubs lack names that exist
# at runtime, dolfinx's assemble_* dispatch at runtime): kipe.fenicsx is checked without
# their types
module = [
  "basix",
  "basix.*",
  "dolfinx",
  "dolfinx.*",
  "ufl",
  "ufl.*",
  "petsc4py",
  "petsc4py.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "kipe.fenicsx.*"
disallow_any_unimported = false # dolfinx's types are unknown without dolfinx

[tool.yamlfix]
line_length = 97
explicit_start = false
section_whitelines = 1
whitelines = 0
