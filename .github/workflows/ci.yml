name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all tags, for the version (hatch-vcs)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # with the versions in .pre-commit-config.yaml
      - run: pre-commit run yamllint --all-files --hook-stage manual
      - run: pre-commit run markdownlint-cli2 --all-files

  test:
    runs-on: ubuntu-latest
    env:
      # MPICH from PyPI communicates through UCX, which probes the RDMA device (mana_0) of some
      # Azure runners, fails, and aborts MPI_Init with a SIGTERM (exit code 143): use shared
      # memory and TCP only
      UCX_TLS: self,sm,tcp
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all tags, for the version (hatch-vcs)
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # non-editable install: with the src layout, tests run against the installed package
      # mpi4py loads an MPI library at runtime; the runner has none, so install MPICH from PyPI
      - run: pip install ".[dev]" mpich
      # MPI problems of the runner show up here, not as a puzzling failure in pytest
      - name: MPI start
        run: python -c "from mpi4py import MPI; print(MPI.Get_library_version().splitlines()[0])"
      - run: pytest -q

  test-fenicsx:
    runs-on: ubuntu-latest
    container: dolfinx/dolfinx:v0.9.0
    env:
      UCX_TLS: self,sm,tcp  # as in the test job, in case the image's MPI uses UCX
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all tags, for the version (hatch-vcs)
      # the checkout belongs to another user than the container's root: let git read it
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # into the image's own Python environment, which has dolfinx, petsc4py and mpi4py (built
      # for the image's MPI); a separate venv would not see them
      - run: python3 -m pip install ".[dev]"
      # for the optional check of the mesh file's content (test_reference_is_the_file_content):
      # a binary wheel only, so that pip never builds HDF5; nothing to do if the image has h5py
      - run: "python3 -m pip install --only-binary=:all: h5py"
      # fail here if dolfinx is missing, instead of skipping all tests
      - name: dolfinx and MPI
        run: |
          python3 -c "import dolfinx; print('dolfinx', dolfinx.__version__)"
          python3 -c "from mpi4py import MPI; print(MPI.Get_library_version().splitlines()[0])"
      - run: python3 -m pytest -q tests/fenicsx
      - run: mpirun -n 2 python3 -m pytest -q tests/fenicsx
